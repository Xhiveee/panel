{{define "layout.html"}}<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · Panel</title>
<style>{{.VendorCSS}}</style>
<style>
:root{
  --bg:#0a0a0a; --panel:#131316; --panel2:#1b1b1f; --border:#2a2a30;
  --text:#f2f2f2; --muted:#9a9aa2;
  --ok:#6ecf82; --warn:#e5c05b; --err:#ef6b5e;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:14px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit}
h1{font-size:20px;margin:0 0 18px;font-weight:600;letter-spacing:.02em}
h2{font-size:15px;margin:0 0 12px;font-weight:600}
.muted{color:var(--muted)}
.mono{font-family:"Cascadia Mono",Consolas,monospace;font-size:12.5px}

.layout{display:flex;min-height:100vh}
.sidebar{width:200px;flex:0 0 200px;background:var(--panel);border-right:1px solid var(--border);
  padding:18px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
.logo{font-weight:700;letter-spacing:.14em;font-size:14px;padding:2px 12px 16px;color:#fff}
.nav a{display:block;padding:8px 12px;border-radius:7px;color:var(--muted)}
.nav a:hover{background:var(--panel2);color:var(--text)}
.nav a.active{background:var(--panel2);color:#fff;font-weight:600}
.spacer{flex:1}
.main{flex:1;min-width:0;padding:24px 28px}

.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px}
.grid{display:grid;gap:14px}
.table{width:100%;border-collapse:collapse;font-size:13.5px}
.table th{text-align:left;color:var(--muted);font-size:11.5px;text-transform:uppercase;
  letter-spacing:.08em;font-weight:600;padding:6px 10px;border-bottom:1px solid var(--border)}
.table td{padding:9px 10px;border-bottom:1px solid var(--border)}
.table tr:last-child td{border-bottom:0}
.table tr:hover td{background:rgba(255,255,255,.02)}

.btn{display:inline-block;background:var(--panel2);border:1px solid var(--border);color:var(--text);
  border-radius:7px;padding:6px 14px;cursor:pointer}
.btn:hover{border-color:#4a4a52}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:#f2f2f2;border-color:#f2f2f2;color:#0a0a0a;font-weight:600}
.btn.primary:hover{background:#fff}
.btn.danger{color:var(--err)}
.btn.sm{padding:3px 9px;font-size:12.5px}

.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;border:1px solid var(--border);color:var(--muted)}
.badge.ok{color:var(--ok);border-color:rgba(110,207,130,.4)}
.badge.err{color:var(--err);border-color:rgba(239,107,94,.4)}
.badge.warn{color:var(--warn);border-color:rgba(229,192,91,.4)}

input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);
  border-radius:7px;padding:8px 10px}
input:focus,select:focus,textarea:focus{outline:0;border-color:#5a5a64}
textarea{resize:vertical}
label{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 4px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grow{flex:1}
.err-text{color:var(--err);font-size:13px}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;
  align-items:center;justify-content:center;z-index:50}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:20px;width:440px;max-width:94vw;max-height:88vh;overflow:auto}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px}
.tabs button{background:none;border:0;color:var(--muted);padding:9px 14px;cursor:pointer;
  border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.active{color:#fff;border-bottom-color:#f2f2f2}

#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:100}
.toast{background:var(--panel2);border:1px solid var(--border);border-left:3px solid #f2f2f2;
  border-radius:8px;padding:10px 14px;max-width:380px}
.toast.ok{border-left-color:var(--ok)}
.toast.err{border-left-color:var(--err)}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-box{width:340px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:28px}
.login-box h1{margin-bottom:2px}

.crumbs a{color:var(--muted)}
.crumbs a:hover{color:#fff}
.stat-num{font-size:26px;font-weight:700;margin-top:2px}
.empty{color:var(--muted);text-align:center;padding:28px 0}
.code{background:var(--panel2);border:1px solid var(--border);border-radius:7px;padding:9px 11px;
  word-break:break-all;margin:8px 0}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:13px}
.term-box{background:#000;border:1px solid var(--border);border-radius:10px;padding:8px;
  height:calc(100vh - 250px);min-height:320px}
.term-box .xterm{height:100%}
[x-cloak]{display:none !important}
</style>
<script src="/static/js/api.js"></script>
<script src="/static/js/store.js"></script>
<script src="/static/js/app.js"></script>
{{template "scripts" .}}
<script src="/static/js/vendor/alpine.min.js" defer></script>
</head>
<body>
{{template "body" .}}
{{template "navbar-end" .}}
<div id="toasts"></div>
</body>
</html>
{{end}}
